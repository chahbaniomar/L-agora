<ion-header>
  <ion-toolbar>
    <ion-title>L'Agora</ion-title>
    <ion-buttons slot="end">
      @if (isAdmin) {
        <ion-button (click)="goAdmin()">Administration</ion-button>
      }
      <ion-button (click)="goProfile()">Mon profil</ion-button>
      <ion-button (click)="logout()">Déconnexion</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h2>Bienvenue sur L'Agora</h2>
</ion-content>
