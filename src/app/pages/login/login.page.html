<ion-content class="login-bg">
  <div class="login-wrap">
    <div class="login-box">
      <h1 class="logo">L'AGORA</h1>
      <h2>Connexion</h2>
      <p class="subtitle">Content de te revoir sur L'Agora.</p>

      <div class="field">
        <label>Email</label>
        <ion-input placeholder="exemple@email.com" aria-label="Email" type="email" [(ngModel)]="email"></ion-input>
      </div>

      <div class="field">
        <label>Mot de passe</label>
        <ion-input aria-label="Mot de passe" type="password" [(ngModel)]="password"></ion-input>
      </div>

      <ion-button expand="block" (click)="login()">Se connecter</ion-button>

      <p class="hint">Première visite sur L'Agora ? <a routerLink="/register">S'inscrire</a></p>
    </div>
  </div>
</ion-content>
