<ion-header>
  <ion-toolbar>
    <ion-title>L'Agora</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h2>Connexion</h2>

  <ion-item>
    <ion-input label="Email" labelPlacement="floating" type="email" [(ngModel)]="email"></ion-input>
  </ion-item>

  <ion-item>
    <ion-input label="Mot de passe" labelPlacement="floating" type="password" [(ngModel)]="password"></ion-input>
  </ion-item>

  <ion-button expand="block" class="ion-margin-top" (click)="login()">Se connecter</ion-button>
  <ion-button expand="block" fill="clear" routerLink="/register">Créer un compte</ion-button>
</ion-content>
